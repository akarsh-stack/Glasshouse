# One service: the Docker image builds the frontend and the backend serves it.
#
# Deploy with Render's Blueprints — New > Blueprint, point it at this repo, and
# it reads this file. The only manual step is the API key, which is marked
# sync: false so it is never committed.
#
# Why not Vercel: this backend keeps a ChromaDB directory and a SQLite trace
# store on disk, holds an ~80 MB ONNX model in memory, runs a background
# asyncio worker for embedding micro-batches, and streams SSE responses for
# 15+ seconds. Serverless functions give none of those — read-only filesystem,
# no state between invocations, short execution limits. It needs a container.

services:
  - type: web
    name: glasshouse
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # --- generation -------------------------------------------------------
      # The ONLY value to set by hand. Everything else below is committed, so a
      # blueprint re-sync restores a working configuration rather than leaving
      # you to reassemble six variables in a dashboard.
      #
      # Get one at https://aistudio.google.com/apikey — free, no card. Keep
      # billing DISABLED on that Google Cloud project or the free tier vanishes.
      - key: LLM_API_KEY
        sync: false

      # Google AI Studio through its OpenAI-compatible endpoint. Anthropic has
      # no free API tier, so the default deploy targets a provider that does;
      # to use Claude instead, set LLM_PROVIDER=anthropic, clear LLM_BASE_URL
      # and the three model pins, and supply ANTHROPIC_API_KEY.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/

      # Pinned because the defaults in services/llm.py are Groq's model ids,
      # and verified against this key's own /models list: the 2.5 series 404s
      # and every Pro model 429s on the free plan, so all three tiers are
      # flash-family. Re-check if a tier starts returning 404.
      - key: LLM_MODEL_FAST
        value: gemini-3.1-flash-lite
      - key: LLM_MODEL_QUALITY
        value: gemini-3-flash-preview
      - key: LLM_MODEL_DEEP
        value: gemini-3.5-flash-lite

      # Seed samples/ when the store is empty. The free plan has no persistent
      # disk, so state resets on every restart — without this a visitor arrives
      # to an empty corpus and no starter questions.
      - key: SEED_SAMPLES
        value: "true"

      # Same-origin: the backend serves the built frontend, so no browser
      # origin ever needs allowing.
      - key: CORS_ORIGINS
        value: ""

      # Ephemeral on the free plan, which is fine — both are regenerable. Add a
      # disk and point these at its mount path to keep uploads across restarts.
      - key: CHROMA_PATH
        value: /data/chroma
      - key: DATABASE_URL
        value: sqlite:////data/glasshouse.db

      # No Redis service here: the cache falls back to an in-memory LRU and the
      # limiter to in-memory buckets, and /api/health reports which is in use.
      # Add a Render Key Value instance and set REDIS_URL to make them shared.
      - key: REDIS_URL
        value: ""
