name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        working-directory: backend
        # Excludes the corpus marker: those download the ~80 MB ONNX MiniLM
        # weights and are run as a separate step so a plain unit failure is
        # distinguishable from a model-download failure in the log.
        run: pytest -m "not corpus" -q

      - name: Retrieval quality and semantic cache
        working-directory: backend
        run: pytest -m corpus -q

      - name: Retrieval eval report
        working-directory: backend
        # Printed into the run log so a regression is legible as numbers, not
        # just a red X. Both configurations, so ADR-006's comparison is on
        # record for every commit.
        run: |
          python -m eval.run_eval
          python -m eval.run_eval --chunker fixed

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Tests
        working-directory: frontend
        run: npm test
