name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        working-directory: backend
        # Excludes the corpus marker: those download the ~80 MB ONNX MiniLM
        # weights and are run as a separate step so a plain unit failure is
        # distinguishable from a model-download failure in the log.
        run: pytest -m "not corpus" -q

      - name: Retrieval quality and semantic cache
        working-directory: backend
        run: pytest -m corpus -q

      - name: Retrieval eval report
        working-directory: backend
        # Printed into the run log so a regression is legible as numbers, not
        # just a red X. Both configurations, so ADR-006's comparison is on
        # record for every commit.
        run: |
          python -m eval.run_eval
          python -m eval.run_eval --chunker fixed

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t glasshouse:ci .

      - name: Boot it and check health
        # The README claims clone-and-run. This is that claim under test: the
        # image has to come up and answer /api/health with no API key set,
        # because retrieval works without one and only generation needs it.
        run: |
          docker run -d --name gh -p 8000:8000 glasshouse:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "never became healthy"; docker logs gh; exit 1

      - name: Ingest a sample and query it
        run: |
          curl -fsS -F "file=@samples/orbital-mechanics-notes.md" \
            http://localhost:8000/api/documents
          # Generation will fail without a key; retrieval must not.
          curl -fsS -X POST http://localhost:8000/api/query \
            -H 'Content-Type: application/json' \
            -d '{"query":"How much water does life support recycle?"}' \
            | grep -q '"type": "retrieval"'

      - name: Boot the openai-compatible provider
        # The run above uses the default provider, so LLM_PROVIDER=openai was
        # never exercised in a clean container — and `openai` was missing from
        # requirements.txt while being present in the dev venv, so the deploy
        # died on boot with ModuleNotFoundError and nothing here noticed.
        #
        # This is the configuration render.yaml actually ships. The key is a
        # dummy: the SDK doesn't connect until a request, so constructing the
        # client is what's under test.
        run: |
          docker rm -f gh-openai 2>/dev/null || true
          docker run -d --name gh-openai -p 8001:8000 \
            -e LLM_PROVIDER=openai \
            -e LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/ \
            -e LLM_API_KEY=dummy-key-not-used-at-startup \
            -e SEED_SAMPLES=true \
            glasshouse:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/health | grep -q '"provider": *"openai"'; then
              echo "openai provider booted and reports itself"; exit 0
            fi
            sleep 2
          done
          echo "openai provider never became healthy"; docker logs gh-openai; exit 1

      - name: Container logs (openai)
        if: always()
        run: docker logs gh-openai || true

      - name: Container logs
        if: always()
        run: docker logs gh || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Tests
        working-directory: frontend
        run: npm test
